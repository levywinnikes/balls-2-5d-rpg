<!DOCTYPE html>
<html>
<head>
    <title>Map Comparison</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #222; color: #fff; }
        .comparison { display: flex; gap: 20px; }
        .map-container { display: flex; flex-direction: column; align-items: center; }
        svg, img { width: 512px; height: 512px; image-rendering: pixelated; border: 1px solid #555; }
        h2 { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Map Comparison: Before vs Current (Level 0)</h1>
    <div class="comparison">
        <div class="map-container">
            <h2>Before</h2>
            <img src="city_3d_mundi_p1_before_l0.svg" />
        </div>
        <div class="map-container">
            <h2>Current</h2>
            <img src="city_3d_mundi_p1_current_l0.svg" />
        </div>
    </div>
</body>
</html>
