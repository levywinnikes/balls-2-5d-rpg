name: BMS Contract Guard

on:
  push:
  pull_request:

jobs:
  check-bms:
    name: Check BMS legacy access
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run BMS contract guard
        run: npm run check:bms
